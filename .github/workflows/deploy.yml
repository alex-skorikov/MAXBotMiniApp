name: Deploy MAXBotMiniApp

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn -B package

      - name: Build Docker image (no cache)
        run: |
          export DOCKER_BUILDKIT=0
          docker build \
            --no-cache \
            --build-arg BUILD_VERSION=${{ github.sha }} \
            -t maxbotminiapp-app:${{ github.sha }} \
            -t maxbotminiapp-app:latest \
            -f Dockerfile \
            .

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/alex/MAXBotMiniApp/"

      - name: Copy Docker image to server
        run: |
          docker save maxbotminiapp-app:latest | gzip > image.tar.gz

      - name: Upload Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "image.tar.gz"
          target: "/home/alex/MAXBotMiniApp/"

      - name: Restart Docker Compose on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alex/MAXBotMiniApp
            gunzip -f image.tar.gz
            docker load < image.tar
            docker compose down
            docker compose up -d --force-recreate
