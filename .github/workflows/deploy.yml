name: Production CI/CD (Deploy MAXBotMiniApp)

on:
  push:
    branches:
      - develop  # Запуск только при пуше в develop

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Liberica)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '17'
          cache: 'maven' # Кэширование ускорит сборку в разы

      # 1. Запуск тестов, проверки Checkstyle и сборки JaCoCo отчетов
      - name: Run tests, checkstyle and generate reports
        run: mvn -B clean verify

      # 2. Генерируем бейдж покрытия JaCoCo под именем jacoco-coverage-badge.svg
      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-xml-file: target/site/jacoco/jacoco.xml
          badges-directory: .
          coverage-badge-filename: jacoco-coverage-badge.svg

      # 3. Генерируем бейдж для Checkstyle под именем checkstyle-badge.svg
      - name: Generate Checkstyle Badge
        run: |
          # Считаем количество ошибок из стандартного отчета xml
          ERRORS=$(xmllint --xpath "count(//error)" target/checkstyle-result.xml)

          # Определяем цвет в зависимости от наличия ошибок
          if [ "$ERRORS" -eq "0" ]; then COLOR="brightgreen"; else COLOR="red"; fi

          # Скачиваем актуальный бейдж
          curl -o checkstyle-badge.svg "https://shields.io{ERRORS}%20errors-${COLOR}.svg"
      

      # 4. Сразу фиксируем бейджи в Git. Тэг [skip ci] защищает от бесконечного цикла сборки
      - name: Commit badges if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update project status badges [skip ci]"
          file_pattern: "jacoco-coverage-badge.svg checkstyle-badge.svg"

      # ========================================================================
      # ДЕПЛОЙ НА СЕРВЕР (Выполняется только если этапы выше прошли успешно)
      # ========================================================================

      # 5. Очищаем целевую папку target на сервере перед копированием
      - name: Prepare server directories
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/alex/MAXBotMiniApp/target
            rm -f /home/alex/MAXBotMiniApp/target/*.jar

      # 6. Копируем JAR-файл напрямую в папку target/ на сервере
      - name: Copy JAR to server target directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/*.jar"
          target: "/home/alex/MAXBotMiniApp/target/"
          strip_components: 1

      # 7. Копируем конфигурационные файлы Docker
      - name: Copy Docker configuration files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Dockerfile,logback.xml"
          target: "/home/alex/MAXBotMiniApp/"

      # 8. Перезапуск контейнеров с принудительной пересборкой без кэша
      - name: SSH Remote Commands (Rebuild & Restart)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alex/MAXBotMiniApp
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate
