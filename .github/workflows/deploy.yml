name: Production CI/CD (Deploy MAXBotMiniApp)

on:
  push:
    branches:
      - develop  # Запуск только при пуше в develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Liberica)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '17'

      # 1. Собираем свежий JAR в облаке GitHub (пропуская тесты для скорости)
      - name: Build JAR with Maven
        run: mvn -B -DskipTests clean package

      # 2. Очищаем целевую папку target на сервере перед копированием, чтобы не копить старые архивы
      - name: Prepare server directories
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/alex/MAXBotMiniApp/target
            rm -f /home/alex/MAXBotMiniApp/target/*.jar

      # 3. копируем JAR-файл напрямую в папку target/ на сервере
      - name: Copy JAR to server target directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/*.jar"
          target: "/home/alex/MAXBotMiniApp/target/"
          strip_components: 1  # Важно! Убирает создание лишней вложенной папки target внутри target

      # 4. Копируем конфигурационные файлы, если они изменились в Git
      - name: Copy Docker configuration files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Dockerfile,logback.xml"
          target: "/home/alex/MAXBotMiniApp/"

      # 5. Жесткий перезапуск контейнеров с полной пересборкой без кэша
      - name: SSH Remote Commands (Rebuild & Restart)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/alex/MAXBotMiniApp
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate
      #
      - name: Run tests and generate reports
        run: mvn -B verify

      # 6. Генерируем бейдж покрытия и явно называем его coverage.svg
      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-xml-file: target/site/jacoco/jacoco.xml
          badges-directory: .
          coverage-badge-filename: coverage.svg

      # 7. Генерируем статический бейдж для Checkstyle
      # Так как у вас включен failsOnError=true, если этот шаг дошел до выполнения, значит ошибок 0
      - name: Generate Checkstyle Badge
        run: |
          echo '<svg xmlns="http://w3.org" width="146" height="20"><linearGradient id="b" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><mask id="a"><rect width="146" height="20" rx="3" fill="#fff"/></mask><g mask="url(#a)"><path fill="#555" d="0 0h69v20H0z"/><path fill="#4c1" d="69 0h77v20H69z"/><path fill="url(#b)" d="0 0h146v20H0z"/></g><g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11"><text x="34.5" y="15" fill="#010101" fill-opacity=".3">checkstyle</text><text x="34.5" y="14">checkstyle</text><text x="106.5" y="15" fill="#010101" fill-opacity=".3">0 errors</text><text x="106.5" y="14">0 errors</text></g></svg>' > checkstyle.svg

      # 8. Коммитим ОБА созданных бейджа обратно в ветку
      - name: Commit badges if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update project status badges [skip ci]"
          file_pattern: "coverage.svg checkstyle.svg"
