name: Generate Coverage Badge

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with tests
        run: mvn -B verify

      - name: Extract coverage from jacoco.xml
        id: coverage
        run: |
          LINE_COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' target/site/jacoco/jacoco.xml)
          PERCENT=$(printf "%.0f" $(echo "$LINE_COVERAGE * 100" | bc))
          echo "percent=$PERCENT" >> $GITHUB_OUTPUT

      - name: Generate badge
        run: |
          PERCENT=${{ steps.coverage.outputs.percent }}
          COLOR="red"
          if [ $PERCENT -ge 90 ]; then COLOR="brightgreen"; fi
          if [ $PERCENT -ge 75 ] && [ $PERCENT -lt 90 ]; then COLOR="yellow"; fi

          echo "<svg xmlns='http://www.w3.org/2000/svg' width='120' height='20'>
            <rect width='120' height='20' fill='#555'/>
            <rect x='60' width='60' height='20' fill='$COLOR'/>
            <text x='30' y='14' fill='#fff' font-family='Verdana' font-size='11'>coverage</text>
            <text x='90' y='14' fill='#fff' font-family='Verdana' font-size='11'>${PERCENT}%</text>
          </svg>" > coverage.svg

      - name: Commit badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge"
          file_pattern: coverage.svg
