version: "3.9"

services:
  app:
    image: maxbotminiapp-app:latest
    container_name: max-miniapp
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./src/main/resources/application.properties:/app/application.properties
    restart: always

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
